apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd # lives in ArgoCD's namespace
spec:
  parentRefs:
    - name: wso2-apim-gateway
      namespace: apim # cross-namespace reference to your Gateway
      sectionName: argocd-https
  hostnames:
    - "argocd.wso2.com"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
